workflows:
  ios-release:
    name: Islora — App Store upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - islora_appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.isloragames.islora
      vars:
        XCODE_PROJECT: "Blockora.xcodeproj"
        XCODE_SCHEME: "Islora"
        BUNDLE_ID: "com.isloragames.islora"
      xcode: "27.0"
    scripts:
      - name: Validate release metadata
        script: |
          python3 release/scripts/validate.py
      - name: Check credentials and set build number
        script: |
          set -eu
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Set the new account API private key}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Set the new account Key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Set the new account Issuer ID}"
          BUILD_NUMBER="${BUILD_NUMBER:-$((CM_BUILD_NUMBER + 1))}"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Install push-enabled App Store provisioning profile
        script: |
          set -eux
          # Codemagic's automatic signing installs a cached "isloracity" profile
          # that predates the Push Notifications capability, so the archive fails
          # with "doesn't include the aps-environment entitlement". The committed
          # profile below is the current App Store Connect "isloracity"
          # (aps-environment: production) and is bound to the same
          # "Apple Distribution: KENNY AVET" certificate Codemagic installs, so
          # the uploaded private key still matches. Replace the stale profile with
          # it before Xcode resolves signing. (A .mobileprovision carries no
          # private key; it ships inside every distributed IPA.)
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          rm -f "$PROFILES_DIR"/*.mobileprovision || true
          UUID=$(security cms -D -i release/signing/isloracity.mobileprovision \
            | plutil -extract UUID raw -)
          cp release/signing/isloracity.mobileprovision \
            "$PROFILES_DIR/$UUID.mobileprovision"
          security cms -D -i release/signing/isloracity.mobileprovision \
            | plutil -extract Entitlements.aps-environment raw -
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
