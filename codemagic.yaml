workflows:
  ios-release:
    name: Islora — App Store upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - islora_appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.isloragames.islora
      vars:
        XCODE_PROJECT: "Blockora.xcodeproj"
        XCODE_SCHEME: "Islora"
        BUNDLE_ID: "com.isloragames.islora"
      xcode: "27.0"
    scripts:
      - name: Validate release metadata
        script: |
          python3 release/scripts/validate.py
      - name: Check credentials and set build number
        script: |
          set -eu
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Set the new account API private key}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Set the new account Key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Set the new account Issuer ID}"
          BUILD_NUMBER="${BUILD_NUMBER:-$((CM_BUILD_NUMBER + 1))}"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
